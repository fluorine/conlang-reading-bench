name: Benchmark verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m conlang.verify_single_probe
      - run: python -m conlang.verify_tier3_search
      - run: python -m conlang.verify_tier4_dynamic
      - run: python -m conlang.verify_tier4_unique
      - run: python -m conlang.verify_tier4_observed
      - run: python -m conlang.verify_tier4_tuning
      - run: python -m conlang.verify_tier4_confirmation
      - run: python -m experiments.build_tier3_site
      - run: git diff --exit-code -- docs/tier3-results.js
      - run: node tests/test_plot.js
  regrade:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: protocol
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: submission
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regrade submissions using the base protocol
        working-directory: protocol
        shell: bash
        run: |
          if [[ -d ../submission/results ]]; then
            python -m conlang verify-results --results ../submission/results --index "$RUNNER_TEMP/regraded.json"
            python -c 'import json, os; from pathlib import Path; assert json.loads((Path(os.environ["RUNNER_TEMP"])/"regraded.json").read_text()) == json.loads(Path("../submission/reports/index.json").read_text()), "Submitted index differs from independent regrade"'
            echo "Regraded from raw responses with the base revision's generator and scorer." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('submission/results/*/*.json') != ''
        with:
          name: regraded-index
          path: ${{ runner.temp }}/regraded.json
